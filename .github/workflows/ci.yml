name: GiftLink CI
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
jobs:
  backend-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install backend dependencies
        working-directory: giftlink-backend
        run: npm install
      - name: Validate backend JavaScript
        working-directory: giftlink-backend
        run: |
          node --check app.js
          node --check db.js
          node --check giftRoutes.js
          node --check searchRoutes.js
          node --check authRoutes.js
